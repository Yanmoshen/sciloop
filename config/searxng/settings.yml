# SciLoop 自带搜索（SearXNG）的最小配置
#
# 为什么要挂这份文件：SearXNG 默认**只输出 HTML**，JSON 接口是关的；
# 而我们的搜索工具要的是 JSON。另外它的「限流器」默认会把 API 调用当机器人挡掉（429）。
#
# 上游引擎（Google / Bing / DuckDuckGo 等）由 SearXNG 自己汇总 —— 它不爬网，
# 只是转发查询，所以**这个容器需要能出网**，但不需要任何商业 API Key。

use_default_settings: true

server:
  # 换成一个随机字符串更稳妥（本机自用不改也能跑）：
  #   openssl rand -hex 24
  secret_key: "sciloop-local-searxng-change-me"
  # 关掉限流器：开着会把我们后端的 JSON 请求当机器人 → 429 拒绝
  limiter: false
  # 关掉图片代理：我们只取文字结果，不需要它去代取图片
  image_proxy: false
  method: "GET"

search:
  # 关键：加上 json，后端的搜索工具才能拿到结构化结果
  formats:
    - html
    - json
  safe_search: 0
  # 留空 = 不自动补全（少一次对外请求）
  autocomplete: ""
  default_lang: "auto"

# ⚠️ 默认只搜 `general` 分类，而 arxiv / github 这些引擎在 `science` / `it` 分类里 ——
# 于是"搜了 0 条"里有一半其实是**分类没选**，不是网络问题（2026-09-22 实测：
# science → arxiv 10 条、it → github/stackoverflow 等 98 条，全程直连、没走代理）。
# 客户端的搜索请求会显式带上 `general,science,it`；这里再打开两个默认关着但直连可用的引擎。
#
# ⚠️ 覆盖默认引擎时**必须写全定义**（`engine:` 等），只写 `name` + `disabled: false` 会被丢掉
# —— 实测过一次：只写两行 → 两个引擎仍然是"未启用"。
engines:
  # 通用网页搜索：Bing 默认是 disabled: true，是这版里唯一默认关着、但直连可用的网页引擎
  # （brave 会 429、DuckDuckGo 返验证码、google cse 需要 key）。
  # 默认定义里的 `base_url: https://cn.bing.com`（中国区建议）在这台机器上**不通**，
  # 所以保持默认的 www.bing.com（实测 200）。
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
  # 学术检索：Crossref 全学科（arXiv / GitHub 默认已启用，在 science / it 分类里）
  - name: crossref
    engine: crossref
    shortcut: cr
    timeout: 30
    disabled: false

ui:
  static_use_hash: true
