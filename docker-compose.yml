# SciLoop 本地编排：db（PostgreSQL 16）+ backend（FastAPI）+ frontend（nginx 静态托管）
# 首次启动：cp .env.example .env && docker compose up -d --build

name: sciloop

services:
  db:
    # 固定 major 版本的 alpine 变体：体积小、启动快，且满足 PostgreSQL 16 契约
    image: postgres:16-alpine
    container_name: sciloop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sciloop}
      POSTGRES_USER: ${POSTGRES_USER:-sciloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sciloop} -d ${POSTGRES_DB:-sciloop}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sciloop-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # 容器内固定用服务名 db，避免 .env 里的 localhost 泄漏到容器
      POSTGRES_HOST: db
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sciloop}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-sciloop}
      APP_ENV: ${APP_ENV:-production}
      # 代码根目录（= Dockerfile 的 WORKDIR），保证 `main`、`api`、`services` 等顶层包可被导入
      PYTHONPATH: /app/server
      # 归一全文文本缓存：固定为容器内路径（与下面的 bind mount 一一对应），
      # 由 services.fulltext.text_cache 读取；写死是为了避免 .env 里的宿主相对路径
      # （如 ./knowledge-base/parses/fulltext-cache）被照搬进容器，导致缓存落到会被清空的临时位置。
      FULLTEXT_TEXT_CACHE_DIR: /app/server/knowledge-base/parses/fulltext-cache
      # APScheduler 三类批量任务默认关闭：演示期不自动抓取/解析，避免消耗外部额度与 LLM 额度
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-0}
      # 联网搜索由 backend 内置的 SearXNG-compatible 内核直接执行，无独立容器。
    volumes:
      # 知识库是仓库内唯一的运行时持久化根目录，Docker 仅做整目录挂载。
      - ./knowledge-base:/app/server/knowledge-base
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # 先迁移建表（可重复执行），再起服务
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # 容器执行环境（2026-09-24）：`docker compose up` 之后就能在"执行环境"里跑命令，
  # **不需要研究者再去起什么本机进程**。想用真机执行的人装上 tools/host-runner 的自启即可，
  # 后端会自动优先用真机（见 services/agent/host_runner.py 的候选顺序）。
  executor:
    build:
      context: ./server
      dockerfile: Dockerfile.executor
    container_name: sciloop-executor
    restart: unless-stopped
    environment:
      # 与后端同一枚 Owner 密钥（少一套密钥就少一处故障面）
      OWNER_TOKEN: ${OWNER_TOKEN:-}
      EXEC_WORKSPACE: /workspace
      EXEC_ARTIFACTS: /artifacts
      EXEC_DEFAULT_CWD: /workspace
      TZ: UTC
    volumes:
      # 整个项目根（研究者 2026-09-24 明确要的：技能要能直接读项目里的文件）
      - ./:/workspace
      # 产物目录：与后端看到的是**同一份**（宿主 knowledge-base/exports）
      - ./knowledge-base/exports:/artifacts
      - ./knowledge-base:/workspace/knowledge-base
    # ⚠️ 故意不发布端口：只在 compose 内网可达，外面连不上
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api/v1}
        VITE_DEFAULT_THEME: ${VITE_DEFAULT_THEME:-light}
    container_name: sciloop-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 必须用 127.0.0.1：容器内 localhost 可能先解析到 ::1，而 nginx 默认只监听 IPv4
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
    name: sciloop_pgdata
