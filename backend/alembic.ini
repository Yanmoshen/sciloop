#
# Alembic 配置（WP01）。连接串由 migrations/env.py 从 app.core.config 读取，
# 这里保留占位以满足 alembic 的必填项。

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os
sqlalchemy.url = postgresql+psycopg://sciloop:change_me@db:5432/sciloop

# 迁移文件名带时间戳前缀，避免并行分支重名
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
