<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SciLoop · 可审计科研流水线：文献空白 → 可复现实验 → 风险自适应"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SciLoop · AI 科研工作台</title>
    <script>
      // 首屏前置应用主题，避免深色模式闪白
      ;(function () {
        try {
          var saved = localStorage.getItem('sciloop.theme')
          var theme = saved || '%VITE_DEFAULT_THEME%'
          var isDark = theme === 'dark'
          document.documentElement.dataset.theme = isDark ? 'dark' : 'light'
          // Element Plus 认的是 html.dark 类（其暗色变量表挂在 .dark 下）
          document.documentElement.classList.toggle('dark', isDark)
          // 原生滚动条 / 表单控件跟随主题（与 stores/session.ts 的 applyTheme 同口径）
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.classList.remove('dark')
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
