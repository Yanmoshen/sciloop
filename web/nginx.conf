# 前端静态托管 + 同源反向代理：/api → backend:8000（SSE 需关闭缓冲）

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # PDF.js 的 worker 产物是 .mjs：nginx 默认 mime.types 未收录该扩展名，
    # 会以 application/octet-stream 返回，浏览器按模块脚本的 MIME 校验会拒绝加载
    # （表现为「Failed to fetch dynamically imported module」）。
    #
    # ⚠️ 不要用 server 级的 `types { text/javascript mjs; }` 去补这个映射：
    #    nginx 的 types 块是**整表替换**而不是追加。那样写会让 html/css/js/svg
    #    全部失去类型、退回 default_type=application/octet-stream，
    #    浏览器会把首页当二进制**下载**而不是渲染（实测故障：访问 / 直接下载文件）。
    #    正确做法：用 location 级 default_type 精确覆盖 .mjs，
    #    由 http 级的 `include /etc/nginx/mime.types;` 保持完整的标准类型表。
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE（禁止 WebSocket；SSE 必须关闭缓冲与读超时）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
    }

    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # 单页应用 history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
