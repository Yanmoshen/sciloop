<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="SciLoop">
  <!-- SciLoop 标志（闭环 + 三节点）。独立文件里 currentColor 没有父级颜色，
       所以这里显式按系统配色切黑/白；线条与圆点各用一套 class，避免 fill/stroke 互相覆盖。 -->
  <style>
    svg { color: #0a0a0a; }
    @media (prefers-color-scheme: dark) { svg { color: #ffffff; } }
    .ring { fill: none; stroke: currentColor; stroke-width: 3; }
    .node { fill: currentColor; stroke: none; }
  </style>
  <circle class="ring" cx="24" cy="24" r="16" />
  <circle class="node" cx="24" cy="8" r="3.6" />
  <circle class="node" cx="37.9" cy="32" r="3.6" />
  <circle class="node" cx="10.1" cy="32" r="3.6" />
</svg>
